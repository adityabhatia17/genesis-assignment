name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    name: contracts in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node scripts/sync-contracts.mjs --check
        if: hashFiles('scripts/sync-contracts.mjs') != ''

  functions:
    name: functions (lint · typecheck · unit · build)
    runs-on: ubuntu-latest
    if: hashFiles('functions/package.json') != ''
    defaults: { run: { working-directory: functions } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: functions/package-lock.json,
          }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  emulator-tests:
    name: rules + integration (emulators)
    runs-on: ubuntu-latest
    needs: functions
    if: hashFiles('functions/package.json') != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: functions/package-lock.json,
          }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - run: npm i -g firebase-tools@15
      - run: npm ci --prefix functions
      - run: npm run test:rules
      - run: npm run test:integration

  frontend:
    name: frontend (lint · typecheck · unit · build · bundle)
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
